command: ["streamlit", "run", "app.py"]

env:
  - name: "LAKEBASE_HOST"
    valueFrom:
      secretKeyRef:
        scope: "ticket-tracker-secrets"
        key: "lakebase-host"
  - name: "LAKEBASE_PORT"
    value: "5432"
  - name: "LAKEBASE_DB"
    valueFrom:
      secretKeyRef:
        scope: "ticket-tracker-secrets"
        key: "lakebase-db"
  - name: "LAKEBASE_USER"
    valueFrom:
      secretKeyRef:
        scope: "ticket-tracker-secrets"
        key: "lakebase-user"
  - name: "LAKEBASE_PASSWORD"
    valueFrom:
      secretKeyRef:
        scope: "ticket-tracker-secrets"
        key: "lakebase-password"
